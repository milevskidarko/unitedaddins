<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="United Addins helps organizations find, license and get the most from trusted software — Foxit PDF & eSign, Mekko Graphics and more." />
    <meta name="theme-color" content="#f7f9ff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before first paint: the saved choice, otherwise the operating system's setting. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070c22')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>United Addins — The right software. The right partnership.</title>
